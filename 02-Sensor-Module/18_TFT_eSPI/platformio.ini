; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
; Cau hinh TFT_eSPI ngay tai day thay vi sua file User_Setup.h trong thu vien
; (sua trong thu vien se bi mat moi lan PlatformIO cap nhat lai thu vien).
; Man ILI9341 2.4"/2.8" 240x320. Dung ST7789 thi doi ILI9341_DRIVER thanh
; ST7789_DRIVER va sua TFT_WIDTH/TFT_HEIGHT dung kich thuoc man.
build_flags =
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT7=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
