; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Bam Upload binh thuong se nap qua cap USB (env mac dinh)
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Lan dau tien bat buoc nap qua cap USB bang env mac dinh o tren.
; Tu lan thu 2 tro di chon env "ota" ben duoi (pio run -e ota -t upload)
; de nap qua WiFi, khong can cam cap nua.

[env:ota]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_protocol = espota
; Dung ten mDNS (hostname dat trong code) hoac dien thang IP cua ESP32
upload_port = esp32-ota.local
upload_flags =
	--auth=Mat_Khau_OTA
